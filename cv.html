<script>
  // ── Update this path if your repo structure differs
  const CV_URL = './data/cv.json';

  function renderCV(d) {
    const { basics, work, education, skills, awards } = d;

    const html = `
      <!-- HEADER -->
      <div class="cv-header">
        <h1 class="cv-name">${basics.name}</h1>
        <p class="cv-role">ML Engineer | Efficient AI &amp; Biomedical Applications</p>
        <div class="cv-contacts">
          <a href="mailto:${basics.email}">${basics.email}</a>
          <a href="${basics.website}" target="_blank" rel="noopener">jboixcampos.github.io</a>
          <span>${basics.location.address}</span>
        </div>
        <p class="cv-summary">${basics.summary}</p>
        </div>

      <!-- EXPERIENCE -->
      <section>
        <p class="section-label">Professional Experience</p>
        <ul class="cv-items">
          ${work.map(job => `
            <li class="cv-item">
              <div class="cv-dates">${job.startDate} &ndash; ${job.endDate}</div>
              <div>
                <p class="cv-institution">${job.company}</p>
                <p class="cv-position">${job.position}</p>
                <p class="cv-location">${job.location}</p>
                <ul class="cv-highlights">
                  ${job.highlights.map(h => `<li>${h}</li>`).join('')}
                </ul>
              </div>
            </li>
          `).join('')}
        </ul>
      </section>

      <!-- EDUCATION -->
      <section>
        <p class="section-label">Education</p>
        <ul class="cv-items">
          ${education.map(e => `
            <li class="cv-item">
              <div class="cv-dates">${e.startDate} &ndash; ${e.endDate}</div>
              <div>
                <p class="cv-institution">${e.institution}</p>
                <p class="cv-position">${e.studyType}</p>
                <p class="cv-location">${e.location}</p>
                <p class="cv-edu-summary">${e.summary}</p>
              </div>
            </li>
          `).join('')}
        </ul>
      </section>

      <!-- SKILLS -->
      <section>
        <p class="section-label">Technical Skills</p>
        <div class="skills-grid">
          ${skills.map(s => `
            <div>
              <p class="skill-group-name">${s.name}</p>
              <div class="skill-tags">
                ${s.keywords.filter(k => k).map(k => `<span class="skill-tag">${k}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </section>

      <!-- AWARDS -->
      <section>
        <p class="section-label">${d.headings.awards || 'Certifications & Awards'}</p>
        <ul class="awards-list">
          ${awards.map(a => `
            <li class="award-item">
              <div>
                <p class="award-title">${a.title}</p>
                <p class="award-awarder">${a.awarder}</p>
              </div>
              <span class="award-cat">${a.category}</span>
            </li>
          `).join('')}
        </ul>
      </section>
    `;

    document.getElementById('cv-root').innerHTML = html;
  }

  fetch(CV_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(renderCV)
    .catch(() => {
      document.getElementById('cv-root').innerHTML =
        '<p class="load-error">Unable to load data. Make sure <code>data/cv.json</code> is committed to your repository.</p>';
    });
</script>

<script>
  function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }
</script>
