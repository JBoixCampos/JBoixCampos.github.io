<script>
  const PUB_URL = './data/publications.json';

  function hl(name) {
    const n = name.trim();
    return (n === 'Boix-Campos J' || n === 'Boix Campos J')
      ? `<strong>${name}</strong>` : name;
  }

  function authors(arr) { return arr.map(hl).join(', '); }

  function render(data) {
    // ── Journals
    const journals = data.publications.filter(p => p.type === 'journal');
    document.getElementById('journals-list').innerHTML = journals.map(p => {
      const venue = [
        `<em>${p.journal}</em>`,
        p.volume ? `${p.volume}` : null,
        p.issue  ? `(${p.issue})`  : null,
        p.pages  ? p.pages         : null,
        p.date
      ].filter(Boolean).join(', ');

      return `
        <li class="pub-item">
          <p class="pub-title">${p.title}</p>
          <p class="pub-authors">${authors(p.authors)}</p>
          <p class="pub-venue">${venue}</p>
          <a class="pub-doi" href="https://doi.org/${p.doi}" target="_blank" rel="noopener">
            doi:${p.doi}
          </a>
        </li>`;
    }).join('');

    // ── Conferences grouped by year (descending)
    const byYear = data.conferences.reduce((acc, c) => {
      (acc[c.year] = acc[c.year] || []).push(c);
      return acc;
    }, {});

    const years = Object.keys(byYear).sort((a, b) => b - a);

    document.getElementById('conferences-list').innerHTML = years.map(year => `
      <div class="conf-year-group">
        <p class="conf-year-label">${year}</p>
        ${byYear[year].map(c => {
          const loc = c.location && c.location !== 'Location TBD' ? ` · ${c.location}` : '';
          return `
            <div class="conf-item">
              <p class="conf-title">${c.title}</p>
              <p class="conf-authors">${authors(c.authors)}</p>
              <p class="conf-event">${c.conference}</p>
              <p class="conf-details">${c.date}${loc}</p>
            </div>`;
        }).join('')}
      </div>
    `).join('');
  }

  fetch(PUB_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      const msg = '<p class="load-error">Unable to load data. Make sure <code>data/publications.json</code> is committed to your repository.</p>';
      document.getElementById('journals-list').innerHTML = `<li class="pub-item">${msg}</li>`;
      document.getElementById('conferences-list').innerHTML = msg;
    });
</script>


<script>
  function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }
